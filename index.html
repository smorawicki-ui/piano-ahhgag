<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Piano app con acordes - Piano Chord App">
  <title>Piano ahhgag</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="loading-content">
    <div class="piano-icon">🎹</div>
    <h1>Piano ahhgag</h1>
    <p id="loading-text">Cargando sonidos... / Loading sounds...</p>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progress-bar"></div>
    </div>
    <p id="loading-percent">0%</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

  <!-- INSTALL BANNER -->
  <div id="install-banner" class="install-banner hidden">
    <span id="install-text">📲 Instalá la app</span>
    <button id="install-btn" class="install-btn">Instalar</button>
    <button id="dismiss-install" class="dismiss-btn" aria-label="Cerrar">✕</button>
  </div>

  <!-- TOP BAR: logo + timbres + lang + settings (todo en una sola fila) -->
  <header>
    <span class="app-title">🎹</span>
    <div class="timbre-tabs" id="timbre-tabs">
      <button class="timbre-tab active" data-timbre="grand">🎹 Grand</button>
      <button class="timbre-tab" data-timbre="cabaret">🎪 Cabaret</button>
      <button class="timbre-tab" data-timbre="rock">🎸 Rock</button>
    </div>
    <div class="header-right">
      <button id="lang-btn" class="icon-btn">ES</button>
      <button id="settings-btn" class="icon-btn">⚙️</button>
    </div>
  </header>

  <!-- CHORD BAR: colapsada por defecto, una sola fila -->
  <section class="chord-section">
    <div class="chord-bar">
      <button class="chord-bar-label" id="chord-panel-toggle" aria-expanded="false">
        🎵 <span data-i18n="chords">Acordes</span> <span class="toggle-arrow">▼</span>
      </button>
      <!-- Selected chord mini-display (visible incluso cuando el panel está cerrado) -->
      <span id="chord-tag" class="chord-tag hidden"></span>
      <button id="play-chord-btn" class="play-chord-mini hidden" title="Tocar acorde">▶</button>
      <button id="clear-chord-btn" class="clear-chord-mini hidden" title="Limpiar">✕</button>
      <!-- Octave + volume compactos en la misma barra -->
      <div class="bar-spacer"></div>
      <button id="oct-down" class="oct-btn">−</button>
      <span id="oct-display" class="oct-num">3</span>
      <button id="oct-up" class="oct-btn">+</button>
      <input type="range" id="vol-slider" class="vol-slider" min="0" max="1" step="0.05" value="0.8">
    </div>

    <!-- Chord panel expandible -->
    <div id="chord-panel" class="chord-panel-collapsed">
      <div class="chord-categories">
        <button class="cat-btn active" data-cat="major" data-i18n-c="major">Mayor</button>
        <button class="cat-btn" data-cat="minor" data-i18n-c="minor">Menor</button>
        <button class="cat-btn" data-cat="seventh" data-i18n-c="seventh">7ª</button>
        <button class="cat-btn" data-cat="sus" data-i18n-c="sus">Sus</button>
      </div>
      <div class="chord-scroll">
        <div id="chord-list" class="chord-list"></div>
      </div>
    </div>
  </section>

  <!-- PIANO KEYBOARD (ocupa todo el espacio restante) -->
  <div class="piano-wrapper">
    <div id="piano" class="piano"></div>
  </div>

  <!-- BOTTOM BAR: sustain + nota tocando -->
  <div class="controls-row">
    <button id="sustain-btn" class="sustain-btn" data-i18n="sustain">🦶 Sustain</button>
    <span id="note-indicator" class="note-indicator-text">—</span>
  </div>

</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 data-i18n="settings">Ajustes</h2>
      <button id="close-settings" class="close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <label data-i18n="reverb">Reverb</label>
        <input type="range" id="reverb-slider" min="0" max="1" step="0.05" value="0.3">
        <span id="reverb-val">30%</span>
      </div>
      <div class="setting-row">
        <label data-i18n="release">Release</label>
        <input type="range" id="release-slider" min="0.3" max="4" step="0.1" value="1.5">
        <span id="release-val">1.5s</span>
      </div>
      <div class="setting-row">
        <label data-i18n="showNoteNames">Mostrar notas</label>
        <input type="checkbox" id="show-notes-cb" checked>
      </div>
      <div class="setting-row">
        <label data-i18n="showChordHighlight">Resaltar acordes</label>
        <input type="checkbox" id="highlight-cb" checked>
      </div>
      <hr>
      <p class="setting-info" data-i18n="cacheInfo">Los sonidos se guardan en caché para uso offline.</p>
      <button id="clear-cache-btn" class="danger-btn" data-i18n="clearCache">🗑️ Borrar caché</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
